name: Deploy to Home Server

# Запускать воркфлоу при пуше в ветку main
on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Права на запись в GitHub Packages (Container Registry)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    # Запускать эту задачу только после успешного завершения build-and-push
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Логинимся в GitHub Container Registry с сервера
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Скачиваем новый образ
            docker pull ghcr.io/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}

            # Останавливаем и удаляем старый контейнер, если он есть (игнорируем ошибки)
            docker stop my-weather-app || true
            docker rm my-weather-app || true

            # Запускаем новый контейнер
            docker run -d \
              --name my-weather-app \
              -p 8080:8080 \
              --restart always \
              ghcr.io/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            
            # Удаляем старые, неиспользуемые образы, чтобы не забивать диск
            docker image prune -f
